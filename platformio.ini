; PlatformIO Project Configuration File
;
; EchoPet firmware for LilyGO T-Echo-Lite + KeyShield.
; This project is self-contained for build: it vendors the board JSON, the
; required Arduino variant.h/variant.cpp, and the patched EPD/BusIO libraries
; required by the EchoPet partial-refresh path.

[platformio]
boards_dir = boards
default_envs = EchoPet_LoRa

[env]
platform = nordicnrf52
board = lilygo_t_echo_lite_nrf52840
framework = arduino
monitor_speed = 115200
upload_speed = 115200
; Use nrfutil when flashing through the UF2/serial bootloader.
; Change to jlink/cmsis-dap/stlink if using an external debugger.
upload_protocol = nrfutil

lib_archive = no

build_flags =
    -Os
    -I variants/t_echo_lite_nrf52840
    -I include
    -I src
    -DARDUINO_NRF52840_T_ECHO_LITE
    -DNRF52840_XXAA
    -DCFG_TUD_CDC=1
    -DCFG_TUD_MSC=0
    -DCFG_TUD_HID=0
    -DCFG_TUD_MIDI=0
    -DCFG_TUD_VIDEO=0
    -DCFG_TUD_VENDOR=0

lib_deps =
    adafruit/Adafruit GFX Library@1.12.6

[env:EchoPet]
build_flags =
    ${env.build_flags}
    -DTECHO_LITE_MINIMAL_PIO=1

[env:EchoPet_LoRa]
extends = env:EchoPet
build_flags =
    ${env:EchoPet.build_flags}
    -DECHOPET_ENABLE_LORA=1
lib_deps =
    ${env.lib_deps}
    jgromes/RadioLib@7.1.2

[env:EchoPet_GAT562_LoRa]
platform = nordicnrf52
board = gat562_mesh_evb_pro
board_build.variants_dir = variants
framework = arduino
monitor_speed = 115200
upload_speed = 115200
upload_protocol = nrfutil
lib_archive = no
lib_ignore =
    Adafruit EPD
    Adafruit_EPD
    Adafruit_EPD-4.5.5
build_flags =
    -Os
    -I variants/gat562_mesh_evb_pro
    -I include
    -I src
    -DECHOPET_TARGET_GAT562=1
    -DECHOPET_ENABLE_LORA=1
    -DARDUINO_NRF52840_FEATHER
    -DNRF52840_XXAA
    -DS140
    -DGAT562_MESH_EVB_PRO
    -DCONFIG_NFCT_PINS_AS_GPIOS=1
    -DCFG_TUD_CDC=1
    -DCFG_TUD_MSC=0
    -DCFG_TUD_HID=0
    -DCFG_TUD_MIDI=0
    -DCFG_TUD_VIDEO=0
    -DCFG_TUD_VENDOR=0
lib_deps =
    adafruit/Adafruit GFX Library@1.12.6
    adafruit/Adafruit SSD1306@2.5.13
    adafruit/Adafruit BusIO@1.16.1
    jgromes/RadioLib@7.1.2
